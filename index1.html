<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32-C3 Car Controller</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 { margin: 10px 0; font-size: 22px; }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      max-width: 360px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .input-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 10px;
    }
    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      width: 65%;
      text-align: center;
    }
    button.conn-btn {
      padding: 10px 15px;
      background: #007bff;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #status-text { font-size: 14px; font-weight: 600; color: #ff5252; }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      grid-gap: 15px;
      justify-content: center;
      margin: 30px auto;
    }
    .btn {
      width: 85px;
      height: 85px;
      border: none;
      border-radius: 16px;
      background: #2979ff;
      color: white;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #1565c0;
      transition: all 0.08s ease;
    }
    .btn:active, .btn.pressed {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1565c0;
      background: #1e88e5;
    }
    .btn-stop {
      background: #e53935;
      box-shadow: 0 4px 0 #b71c1c;
      font-size: 20px;
    }
    .btn-stop:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #b71c1c;
      background: #c62828;
    }
  </style>
</head>
<body>

  <h2>XE ĐIỀU KHIỂN ESP32-C3</h2>

  <div class="status-card">
    <div class="input-group">
      <input type="text" id="ip-address" placeholder="Nhập IP (VD: 192.168.1.15)">
      <button class="conn-btn" onclick="connectSocket()">Kết Nối</button>
    </div>
    <div id="status-text">Chưa kết nối</div>
  </div>

  <div class="d-pad">
    <div></div>
    <button class="btn" data-cmd="F">▲</button>
    <div></div>

    <button class="btn" data-cmd="L">◀</button>
    <button class="btn btn-stop" data-cmd="S">DỪNG</button>
    <button class="btn" data-cmd="R">▶</button>

    <div></div>
    <button class="btn" data-cmd="B">▼</button>
    <div></div>
  </div>

  <script>
    let ws = null;
    const statusText = document.getElementById("status-text");

    function connectSocket() {
      const ip = document.getElementById("ip-address").value.trim();
      if (!ip) {
        alert("Vui lòng nhập địa chỉ IP!");
        return;
      }

      if (ws) { ws.close(); }

      statusText.innerText = "Đang kết nối...";
      statusText.style.color = "#ffb300";

      ws = new WebSocket("ws://" + ip + ":81/");

      ws.onopen = function() {
        statusText.innerText = "Đã kết nối trực tiếp với ESP32!";
        statusText.style.color = "#00e676";
      };

      ws.onclose = function() {
        statusText.innerText = "Mất kết nối!";
        statusText.style.color = "#ff5252";
      };

      ws.onerror = function() {
        statusText.innerText = "Lỗi kết nối!";
        statusText.style.color = "#ff5252";
      };
    }

    function sendCommand(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
      }
    }

    // Gán sự kiện nhấn giữ (Touch và Mouse) cho các nút
    document.querySelectorAll(".btn").forEach(button => {
      const cmd = button.getAttribute("data-cmd");

      // Sự kiện chuột (PC)
      button.addEventListener("mousedown", () => {
        button.classList.add("pressed");
        sendCommand(cmd);
      });
      button.addEventListener("mouseup", () => {
        button.classList.remove("pressed");
        if (cmd !== 'S') sendCommand('S');
      });

      // Sự kiện cảm ứng (Điện thoại)
      button.addEventListener("touchstart", (e) => {
        e.preventDefault();
        button.classList.add("pressed");
        sendCommand(cmd);
      });
      button.addEventListener("touchend", (e) => {
        e.preventDefault();
        button.classList.remove("pressed");
        if (cmd !== 'S') sendCommand('S');
      });
    });
  </script>
</body>
</html>
